# See https://docs.docker.com/compose/compose-file/ for information about what
# commands you can use in this file.
#
# Note that you must use the `docker stack deploy` command, with any required
# command line flags, in order to actually get any replicas started. That
# command requires that a docker swarm is already running in order to function.

services:
  kademlia-bootstrap:
    image: kadlab:latest # Make sure your Docker image has this name.
    command:
      [
        "./kadlab",
        "--transport",
        "udp",
        "--listen-addr",
        "0.0.0.0:8000",
        "--addr",
        "kademlia-bootstrap:8000",
        "serve",
      ]
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 10s
    networks:
      - kademlia_network

  kademlia-nodes:
    image: kadlab:latest # Make sure your Docker image has this name.
    command:
      [
        "sh",
        "-c",
        "./kadlab --transport udp --listen-addr 0.0.0.0:8000 --addr $$(hostname -i):8000 --bootstrap-addr kademlia-bootstrap:8000 serve",
      ]
    deploy:
      mode: replicated
      replicas: 49 
#        resources:
#           limits:
#              cpus: "0.1"
#              memory: 50M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 10s
#    ports:
#      - "4000:80"
    networks:
      - kademlia_network
      
networks:
  kademlia_network:
    driver: overlay
    attachable: true
