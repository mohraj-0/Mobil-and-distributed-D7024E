name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: labs/go.mod
          cache-dependency-path: labs/go.sum

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee go-test.log

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: |
          set -o pipefail
          go test -race -v ./... 2>&1 | tee go-test-race.log

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Go test results"
            echo
            echo "### go test -v ./..."
            echo '```text'
            if [ -f go-test.log ]; then
              tail -n 80 go-test.log
            else
              echo "go-test.log was not created"
            fi
            echo '```'
            echo
            echo "### go test -race -v ./..."
            echo '```text'
            if [ -f go-test-race.log ]; then
              tail -n 80 go-test-race.log
            else
              echo "go-test-race.log was not created"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-logs
          path: |
            labs/go-test.log
            labs/go-test-race.log
          if-no-files-found: ignore
