name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: labs/go.mod
          cache-dependency-path: labs/go.sum

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
